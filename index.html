<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Fkra Tounsiya</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #888888;
    --line: #cccccc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --fg: #f2f2f2;
      --muted: #888888;
      --line: #333333;
    }
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.3px;
  }
  a { color: inherit; }

  .topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 26px; border-bottom: 0.5px solid var(--line);
  }
  .wordmark { font-size: 13px; letter-spacing: 2px; text-decoration: none; white-space: nowrap; }
  .cursor { display: inline-block; width: 7px; background: var(--fg); margin-left: 2px; animation: blink 0.9s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .btn-contact { font-size: 11px; text-transform: uppercase; border: 0.5px solid var(--fg); padding: 6px 12px; text-decoration: none; }

  .wrap {
    max-width: 480px;
    padding: 50px 26px;
  }
  .catalogue-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 24px;
  }
  .section-list {
    display: flex;
    flex-direction: column;
  }
  .section-link {
    display: block;
    text-decoration: none;
    color: var(--fg);
    padding: 18px 0;
    text-align: left;
  }
  .section-link .title {
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    min-height: 22px;
  }
  .section-link .sub {
    font-size: 10px;
    color: var(--muted);
    padding-top: 6px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .section-link .sub.shown { opacity: 1; }

  /* ---------- Footer (short, full-width, centered) ---------- */
  footer.site-footer {
    border-top: 0.5px solid var(--line);
    padding: 26px 26px 20px;
    width: 100%;
    text-align: center;
  }
  .footer-links {
    display: flex; gap: 18px; flex-wrap: wrap;
    justify-content: center;
    padding-bottom: 14px;
  }
  .footer-links a {
    font-size: 11px; text-decoration: none; color: var(--fg); letter-spacing: 0.5px;
  }
  .footer-meta {
    font-size: 10px; color: var(--muted); letter-spacing: 0.5px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding-bottom: 14px;
  }
  .footer-bottom {
    display: flex; justify-content: center; gap: 20px; align-items: center;
    padding-top: 14px; border-top: 0.5px solid var(--line);
    font-size: 10px; color: var(--muted);
  }
</style>
</head>
<body>

<nav class="topnav">
  <span class="wordmark" id="wordmark-type"></span>
  <a class="btn-contact" href="#">Contact</a>
</nav>

<div class="wrap">
  <div class="catalogue-label">// OUR CATALOGUE</div>

  <div class="section-list">
    <a class="section-link" href="essentials.html">
      <div class="title" id="title-essentials"></div>
      <div class="sub" id="sub-essentials">Always available — the basics</div>
    </a>
    <a class="section-link" href="drop.html">
      <div class="title" id="title-drop"></div>
      <div class="sub" id="sub-drop">Winter Arc — limited time</div>
    </a>
    <a class="section-link" href="archive.html">
      <div class="title" id="title-archive"></div>
      <div class="sub" id="sub-archive">Past drops — vaulted</div>
    </a>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-links">
    <a href="essentials.html">Essentials</a>
    <a href="drop.html">New Drop</a>
    <a href="archive.html">Archive</a>
    <a href="#">Contact</a>
  </div>
  <div class="footer-meta">
    <span>hello@fkratounsiya.com</span>
    <span>Tunis, Tunisia</span>
  </div>
  <div class="footer-bottom">
    <span>© 2026 Fkra Tounsiya</span>
    <span>Made in Tunisia</span>
  </div>
</footer>

<script>
  // Type the top wordmark, with a persistent blinking cursor.
  function typeWithCursor(el, text, speed, onDone) {
    let i = 0;
    function step() {
      if (i <= text.length) {
        el.innerHTML = text.slice(0, i) + '<span class="cursor">&nbsp;</span>';
        i++;
        setTimeout(step, speed);
      } else if (onDone) {
        onDone();
      }
    }
    step();
  }

  // Type a section title with no cursor, then reveal its subtitle, then call onDone.
  function typeTitle(el, subEl, text, speed, onDone) {
    let i = 0;
    function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, speed);
      } else {
        if (subEl) subEl.classList.add("shown");
        setTimeout(() => { if (onDone) onDone(); }, 150);
      }
    }
    step();
  }

  const wordmarkEl = document.getElementById("wordmark-type");

  typeWithCursor(wordmarkEl, "FKRA_TOUNSIYA", 70, () => {
    // Once the wordmark finishes, type each section title in sequence.
    const sections = [
      { title: document.getElementById("title-essentials"), sub: document.getElementById("sub-essentials"), text: "Essentials" },
      { title: document.getElementById("title-drop"), sub: document.getElementById("sub-drop"), text: "New Drop" },
      { title: document.getElementById("title-archive"), sub: document.getElementById("sub-archive"), text: "Archive" }
    ];
    let idx = 0;
    function next() {
      if (idx >= sections.length) return;
      const s = sections[idx];
      idx++;
      typeTitle(s.title, s.sub, s.text, 45, next);
    }
    next();
  });
</script>
</body>
</html>
